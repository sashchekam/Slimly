# Конфигурация SwiftLint для Slimly.
#
# Пороги подобраны под реальный код проекта: SwiftUI-вёрстка и мэпперы
# медиаформатов длиннее обычного кода, а комментарии здесь развёрнутые
# и на русском — поэтому длину файлов считаем без них.

excluded:
  - Derived
  - .build
  - Tuist/.build # исходники сторонних пакетов SPM — чужой код мы не правим
  - Tools # разовые скрипты генерации ресурсов, в сборку не попадают

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_object_literal
  - empty_collection_literal
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - period_spacing
  - prefer_key_path
  - prefer_self_type_over_type_of_self
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - reduce_into
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - static_operator
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - weak_delegate
  - yoda_condition

disabled_rules:
  # У SwiftUI это норма: `Button(action:) { ... } label: { ... }` и подобное.
  - multiple_closures_with_trailing_closure
  # `count == 0` в проекте встречается на типах без `isEmpty` (PHFetchResult)
  # и на обычных счётчиках — правило даёт только ложные срабатывания.
  - empty_count

# Property wrapper пишется на своей строке, а не в хвосте объявления: слева
# от `var` тогда остаётся только модификатор доступа, и глазами видно, где
# у экрана состояние, а где обычное поле. `@ViewBuilder` в этом же списке —
# он и так всегда стоит над computed-свойством.
attributes:
  always_on_line_above:
    - "@AppStorage"
    - "@Bindable"
    - "@Binding"
    - "@Environment"
    - "@EnvironmentObject"
    - "@FetchRequest"
    - "@FocusState"
    - "@GestureState"
    - "@Namespace"
    - "@ObservationIgnored"
    - "@ObservedObject"
    - "@Published"
    - "@ScaledMetric"
    - "@SceneStorage"
    - "@State"
    - "@StateObject"
    - "@ViewBuilder"

# Многострочные литералы в проекте всегда с висячей запятой: так строка
# добавляется одним диффом, а не двумя.
trailing_comma:
  mandatory_comma: true

# Короткие имена — это токены дизайн-системы (`sm`, `md`, `lg`) и координаты
# в геометрии (`x`, `y`, `dx`). Длинное имя там читается хуже короткого.
identifier_name:
  min_length:
    warning: 1
  excluded:
    - id

type_name:
  min_length:
    warning: 2

nesting:
  type_level: 2

large_tuple:
  warning: 3
  error: 4

line_length:
  warning: 120
  error: 160
  ignores_urls: true

file_length:
  warning: 600
  error: 900
  ignore_comment_only_lines: true

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 100
  error: 150

# Мэпперы форматов и резолверы — это длинные `switch` без ветвлений внутри:
# сложности в них нет, есть перечисление.
cyclomatic_complexity:
  ignores_case_statements: true

# Условие в несколько строк закрывается скобкой на своей строке — иначе
# `{` теряется в хвосте последнего `let`.
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true

# Пустое тело пишется как `{ }`: пара скобок с пробелом видна на строке,
# а слипшееся `{}` глазами путается с `()` и теряется в хвосте объявления.
custom_rules:
  empty_braces_spacing:
    name: "Пробел в пустых скобках"
    regex: '\{\}'
    message: "Пустое тело пишется как { }, а не {}"
    severity: warning
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
      - string
      - string_interpolation_anchor

reporter: "xcode"
